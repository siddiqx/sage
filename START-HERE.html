<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Forge</title>
  <style>
    :root {
      --bg: #090e17;
      --panel: #0f172a;
      --panel-hover: #162035;
      --card: #131c31;
      --card-hover: #192540;
      --border: #1e293b;
      --border-accent: rgba(56, 189, 248, 0.4);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --cyan: #38bdf8;
      --cyan-soft: rgba(56, 189, 248, 0.1);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.1);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.1);
      --purple: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Master Navigation Bar */
    header.master-bar {
      height: 60px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.75rem;
      z-index: 100;
      flex-shrink: 0;
    }

    .master-left {
      display: flex;
      align-items: center;
      gap: 1.75rem;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      user-select: none;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }

    /* Mode Navigation Tabs */
    .mode-nav {
      display: flex;
      background: rgba(9, 14, 23, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 0.95rem;
      border-radius: 6px;
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .mode-btn:hover {
      color: #fff;
    }

    .mode-btn.active {
      color: #fff;
      background: var(--card);
      border: 1px solid var(--border-accent);
    }

    /* Master Right Actions */
    .master-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .search-box {
      position: relative;
      width: 250px;
    }

    .search-input {
      width: 100%;
      background: rgba(9, 14, 23, 0.8);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 2rem 0.4rem 2.2rem;
      color: var(--text);
      font-size: 0.825rem;
      outline: none;
      transition: all 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--cyan);
      background: var(--card);
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-hotkey {
      position: absolute;
      right: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      background: var(--border);
      color: var(--text-dim);
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      pointer-events: none;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(9, 14, 23, 0.6);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      font-size: 0.775rem;
    }

    .progress-bar-bg {
      width: 50px;
      height: 5px;
      background: #1e293b;
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--green);
      width: 0%;
      transition: width 0.3s ease;
    }

    .btn-copy-root {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.775rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-copy-root:hover {
      border-color: var(--cyan);
      color: #fff;
    }

    /* Main Application Body */
    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* Left Sidebar */
    aside.sidebar {
      width: 250px;
      background-color: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      user-select: none;
    }

    .sidebar-title {
      padding: 1.25rem 1.25rem 0.6rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .subject-menu {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      padding: 0 0.6rem 1.5rem;
    }

    .subject-item {
      display: flex;
      align-items: center;
      padding: 0.6rem 0.85rem;
      border-radius: 6px;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.15s ease;
      text-align: left;
      gap: 0.6rem;
    }

    .subject-item:hover {
      background: var(--panel-hover);
      color: #fff;
    }

    .subject-item.active {
      background: var(--card);
      color: #fff;
      font-weight: 600;
      border: 1px solid var(--border-accent);
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 0.85rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-dim);
      background: rgba(9, 14, 23, 0.4);
    }

    .btn-reset {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.75rem;
      text-decoration: underline;
    }

    .btn-reset:hover {
      color: #f87171;
    }

    /* Content Stage */
    main.stage {
      flex: 1;
      overflow-y: auto;
      padding: 2.25rem 3.5rem 5rem;
      background: var(--bg);
    }

    .stage-container {
      max-width: 1040px;
      margin: 0 auto;
    }

    /* Subject Header */
    .subject-header {
      margin-bottom: 2rem;
    }

    .subject-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .subject-summary {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.55;
      max-width: 850px;
    }

    /* Inner Subject Navigation Tabs */
    .subject-tabs {
      display: flex;
      gap: 0.4rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      margin-bottom: 2rem;
    }

    .sub-tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.45rem 0.95rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .sub-tab-btn:hover {
      color: #fff;
      background: var(--panel);
    }

    .sub-tab-btn.active {
      color: #fff;
      background: var(--panel);
      border: 1px solid var(--border-accent);
    }

    /* Phase-by-Phase Learning Path */
    .phase-block {
      margin-bottom: 2.5rem;
    }

    .phase-heading {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--cyan);
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .phase-heading::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      display: inline-block;
    }

    .step-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      transition: all 0.2s ease;
    }

    .step-card:hover {
      border-color: rgba(56, 189, 248, 0.3);
      background: var(--card-hover);
    }

    .step-card.done {
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.02);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.4rem;
    }

    .step-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .step-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    .step-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(30, 41, 59, 0.5);
    }

    .step-links {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s;
    }

    .btn-link:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .btn-check {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.775rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-check:hover {
      border-color: var(--green);
      color: var(--green);
    }

    .btn-check.checked {
      background: var(--green-soft);
      border-color: rgba(16, 185, 129, 0.35);
      color: var(--green);
    }

    /* Grid for Books, Repos & Guides */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .grid-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .grid-card:hover {
      border-color: var(--border-accent);
      transform: translateY(-2px);
    }

    .grid-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.35rem;
    }

    .grid-card p {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }

    .grid-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--cyan-soft);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--cyan);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s;
    }

    .btn-primary:hover {
      background: var(--cyan);
      color: #040812;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.775rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-secondary:hover {
      border-color: var(--cyan);
      color: #fff;
    }

    /* Textbook Accordion */
    .book-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .book-header {
      padding: 1.15rem 1.35rem;
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .book-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .book-header span {
      font-size: 0.825rem;
      color: var(--text-dim);
    }

    .chapters-stack {
      padding: 0.25rem 0;
    }

    .chapter-item {
      padding: 0.7rem 1.35rem;
      border-bottom: 1px solid rgba(30, 41, 59, 0.4);
      display: flex;
      align-items: baseline;
      gap: 0.85rem;
      font-size: 0.875rem;
    }

    .chapter-item:last-child {
      border-bottom: none;
    }

    .ch-num {
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--cyan);
      min-width: 28px;
    }

    .ch-title {
      font-weight: 600;
      color: #f1f5f9;
      flex: 1;
    }

    .ch-sections {
      font-size: 0.775rem;
      color: var(--text-dim);
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #fff;
      padding: 0.7rem 1.35rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- Top Master Bar -->
  <header class="master-bar">
    <div class="master-left">
      <div class="brand-box" onclick="switchMode('curriculum')">
        <div class="brand-icon">⚡</div>
        <div class="brand-title">Learning Forge</div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="mode-nav">
        <button class="mode-btn active" id="modeCurriculum" onclick="switchMode('curriculum')">
          Curriculum
        </button>
        <button class="mode-btn" id="modeBooks" onclick="switchMode('books')">
          Textbooks
        </button>
        <button class="mode-btn" id="modeLabs" onclick="switchMode('labs')">
          Practice Labs
        </button>
        <button class="mode-btn" id="modeGuides" onclick="switchMode('guides')">
          Study Guides
        </button>
      </nav>
    </div>

    <div class="master-right">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="globalSearch" class="search-input" placeholder="Search topics, books...">
        <span class="search-hotkey">/</span>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span id="progressText" style="font-weight:600; color:var(--green);">0%</span>
      </div>

      <button class="btn-copy-root" onclick="copyText('D:\\Learning')">
        Copy Root Path
      </button>
    </div>
  </header>

  <!-- Body -->
  <div class="app-body">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-title" id="sidebarTitle">Subjects</div>
      <div class="subject-menu" id="sidebarMenu">
        <!-- Rendered via JS -->
      </div>
      <div class="sidebar-footer">
        <span>Done: <strong id="statsDone" style="color:var(--green);">0</strong> / 46</span>
        <button class="btn-reset" onclick="resetProgress()">Reset</button>
      </div>
    </aside>

    <!-- Main Stage -->
    <main class="stage" id="stage">
      <div class="stage-container" id="stageContent">
        <!-- Rendered via JS -->
      </div>
    </main>
  </div>

  <div id="toast">Copied to clipboard!</div>

    const STORAGE_KEY = 'LEARNING_FORGE_V2_CHECKED';

    let currentMode = 'curriculum'; // 'curriculum' | 'books' | 'labs' | 'guides'
    let currentSubjectIdx = 0;
    let currentSubjectTab = 'path'; // 'path' | 'books' | 'lab' | 'guides'
    let completedSteps = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
    let searchQuery = '';

    function init() {
      const searchInput = document.getElementById('globalSearch');
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        renderStage();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === 'Escape' && document.activeElement === searchInput) {
          searchInput.value = '';
          searchQuery = '';
          renderStage();
          searchInput.blur();
        }
      });

      updateProgress();
      renderSidebar();
      renderStage();
    }

    function switchMode(mode) {
      currentMode = mode;
      searchQuery = '';
      document.getElementById('globalSearch').value = '';

      ['Curriculum', 'Books', 'Labs', 'Guides'].forEach(m => {
        const btn = document.getElementById('mode' + m);
        if (btn) btn.classList.remove('active');
      });

      if (mode === 'curriculum') document.getElementById('modeCurriculum').classList.add('active');
      else if (mode === 'books') document.getElementById('modeBooks').classList.add('active');
      else if (mode === 'labs') document.getElementById('modeLabs').classList.add('active');
      else if (mode === 'guides') document.getElementById('modeGuides').classList.add('active');

      renderSidebar();
      renderStage();
    }

    function selectSubject(idx) {
      currentMode = 'curriculum';
      currentSubjectIdx = idx;
      currentSubjectTab = 'path';
      document.getElementById('modeCurriculum').classList.add('active');
      ['Books', 'Labs', 'Guides'].forEach(m => document.getElementById('mode' + m).classList.remove('active'));

      renderSidebar();
      renderStage();
      document.getElementById('stage').scrollTop = 0;
    }

    function switchSubjectTab(tab) {
      currentSubjectTab = tab;
      renderStage();
    }

    function toggleStep(id) {
      if (completedSteps.has(id)) {
        completedSteps.delete(id);
      } else {
        completedSteps.add(id);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...completedSteps]));
      updateProgress();
      renderStage();
    }

    function updateProgress() {
      let total = 0;
      DATA.subjects.forEach(s => {
        s.phases.forEach(p => total += p.steps.length);
      });
      const count = completedSteps.size;
      const pct = total > 0 ? Math.round((count / total) * 100) : 0;

      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').innerText = pct + '%';
      document.getElementById('statsDone').innerText = count;
    }

    function resetProgress() {
      if (confirm('Reset all completed step checkmarks?')) {
        completedSteps.clear();
        localStorage.removeItem(STORAGE_KEY);
        updateProgress();
        renderStage();
      }
    }

    function copyText(txt) {
      navigator.clipboard.writeText(txt).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
      });
    }

    function renderSidebar() {
      const title = document.getElementById('sidebarTitle');
      const menu = document.getElementById('sidebarMenu');
      menu.innerHTML = '';

      if (currentMode === 'curriculum') {
        title.innerText = 'Subjects (10)';
        DATA.subjects.forEach((s, idx) => {
          const btn = document.createElement('button');
          btn.className = 'subject-item' + (idx === currentSubjectIdx ? ' active' : '');
          btn.onclick = () => selectSubject(idx);
          btn.innerHTML = `<span>${s.name}</span>`;
          menu.appendChild(btn);
        });
      } else if (currentMode === 'books') {
        title.innerText = 'Textbooks (18)';
        DATA.books.forEach((b, idx) => {
          const btn = document.createElement('button');
          btn.className = 'subject-item';
          btn.onclick = () => {
            currentMode = 'books';
            renderStage();
            const el = document.getElementById('book-' + idx);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          };
          btn.innerHTML = `<span style="font-size:0.8rem;">${b.title}</span>`;
          menu.appendChild(btn);
        });
      } else if (currentMode === 'labs') {
        title.innerText = 'Practice Labs (6)';
        DATA.repos.forEach((r, idx) => {
          const btn = document.createElement('button');
          btn.className = 'subject-item';
          btn.onclick = () => {
            currentMode = 'labs';
            renderStage();
            const el = document.getElementById('repo-' + idx);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          };
          btn.innerHTML = `<span style="font-size:0.825rem;">${r.name}</span>`;
          menu.appendChild(btn);
        });
      } else if (currentMode === 'guides') {
        title.innerText = 'Study Guides (22)';
        DATA.guides.forEach((g, idx) => {
          const btn = document.createElement('button');
          btn.className = 'subject-item';
          btn.onclick = () => {
            currentMode = 'guides';
            renderStage();
            const el = document.getElementById('guide-' + idx);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          };
          btn.innerHTML = `<span style="font-size:0.8rem;">${g.title}</span>`;
          menu.appendChild(btn);
        });
      }
    }

    function renderStage() {
      const container = document.getElementById('stageContent');

      if (searchQuery !== '') {
        renderSearch(container);
        return;
      }

      if (currentMode === 'curriculum') {
        renderSubject(container);
      } else if (currentMode === 'books') {
        renderBooks(container);
      } else if (currentMode === 'labs') {
        renderLabs(container);
      } else if (currentMode === 'guides') {
        renderGuides(container);
      }
    }

    function renderSubject(container) {
      const s = DATA.subjects[currentSubjectIdx];

      const tabsHtml = `
        <div class="subject-tabs">
          <button class="sub-tab-btn ${currentSubjectTab === 'path' ? 'active' : ''}" onclick="switchSubjectTab('path')">
            Learning Path
          </button>
          <button class="sub-tab-btn ${currentSubjectTab === 'books' ? 'active' : ''}" onclick="switchSubjectTab('books')">
            Textbooks (${s.books.length})
          </button>
          <button class="sub-tab-btn ${currentSubjectTab === 'lab' ? 'active' : ''}" onclick="switchSubjectTab('lab')">
            Practice Lab ${s.repo ? '(1)' : '(0)'}
          </button>
          <button class="sub-tab-btn ${currentSubjectTab === 'guides' ? 'active' : ''}" onclick="switchSubjectTab('guides')">
            Guides (${s.guides.length})
          </button>
        </div>
      `;

      let contentHtml = '';

      if (currentSubjectTab === 'path') {
        contentHtml = s.phases.map(ph => `
          <div class="phase-block">
            <div class="phase-heading">${ph.phase_name}</div>
            ${ph.steps.map(step => {
              const isDone = completedSteps.has(step.id);
              return `
                <div class="step-card ${isDone ? 'done' : ''}">
                  <div class="step-header">
                    <h3 class="step-title">${step.title}</h3>
                    <button class="btn-check ${isDone ? 'checked' : ''}" onclick="toggleStep('${step.id}')">
                      ${isDone ? '✓ Completed' : '○ Mark Done'}
                    </button>
                  </div>
                  <p class="step-desc">${step.desc}</p>
                  <div class="step-actions">
                    <div class="step-links">
                      ${step.reading_url ? `
                        <a href="${step.reading_url}" target="_blank" class="btn-link">
                          📖 ${step.reading_label} ↗
                        </a>
                      ` : ''}
                      ${step.practice_url ? `
                        <a href="${step.practice_url}" target="_blank" class="btn-link">
                          🔬 ${step.practice_label} ↗
                        </a>
                      ` : ''}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `).join('');
      } else if (currentSubjectTab === 'books') {
        const matchingBooks = DATA.books.filter(b => b.url.startsWith(s.folder));
        if (matchingBooks.length === 0) {
          contentHtml = `<p style="color:var(--text-muted); padding:2rem 0;">No textbook PDFs in this subject. See Study Guides tab.</p>`;
        } else {
          contentHtml = matchingBooks.map((b, idx) => `
            <div class="book-card">
              <div class="book-header">
                <div>
                  <h3>${b.title}</h3>
                  <span>${b.author} &bull; ${b.chapters.length} Chapters</span>
                </div>
                <a href="${b.url}" target="_blank" class="btn-primary">Read Book ↗</a>
              </div>
              <div class="chapters-stack">
                ${b.chapters.map(ch => `
                  <div class="chapter-item">
                    <span class="ch-num">${ch.num}</span>
                    <span class="ch-title">${ch.title}</span>
                    <span class="ch-sections">${ch.sections ? ch.sections.join(' &bull; ') : ''}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('');
        }
      } else if (currentSubjectTab === 'lab') {
        if (!s.repo) {
          contentHtml = `<p style="color:var(--text-muted); padding:2rem 0;">No dedicated repository for this subject. Practice exercises are linked directly in the Learning Path.</p>`;
        } else {
          const r = s.repo;
          const escapedCmd = (r.cmd || '').replace(/\\/g, '\\\\');
          contentHtml = `
            <div class="grid-card" style="max-width:550px;">
              <div>
                <h3>${r.name}</h3>
                <p>${r.desc}</p>
              </div>
              <div class="grid-card-footer">
                <button class="btn-secondary" onclick="copyText('${escapedCmd}')">📋 Copy Command</button>
                <a href="${r.url}" target="_blank" class="btn-primary">Open Practice Portal ↗</a>
              </div>
            </div>
          `;
        }
      } else if (currentSubjectTab === 'guides') {
        contentHtml = `
          <div class="items-grid">
            ${s.guides.map(g => `
              <div class="grid-card">
                <div>
                  <h3>${g.title}</h3>
                  <p>${g.desc}</p>
                </div>
                <div class="grid-card-footer">
                  <span></span>
                  <a href="${g.url}" target="_blank" class="btn-primary">Read Guide ↗</a>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="subject-header">
          <h1 class="subject-title">${s.name}</h1>
          <p class="subject-summary">${s.summary}</p>
        </div>
        ${tabsHtml}
        ${contentHtml}
      `;
    }

    function renderBooks(container) {
      container.innerHTML = `
        <div style="margin-bottom:2rem;">
          <h1 style="font-size:2rem; font-weight:800; color:#fff; margin-bottom:0.35rem;">Textbooks</h1>
          <p style="color:var(--text-muted);">18 primary textbooks and manuals with full chapter breakdowns.</p>
        </div>
        ${DATA.books.map((b, idx) => `
          <div class="book-card" id="book-${idx}">
            <div class="book-header">
              <div>
                <h3>${b.title}</h3>
                <span>${b.author} &bull; ${b.chapters.length} Chapters</span>
              </div>
              <a href="${b.url}" target="_blank" class="btn-primary">Read Book ↗</a>
            </div>
            <div class="chapters-stack">
              ${b.chapters.map(ch => `
                <div class="chapter-item">
                  <span class="ch-num">${ch.num}</span>
                  <span class="ch-title">${ch.title}</span>
                  <span class="ch-sections">${ch.sections ? ch.sections.join(' &bull; ') : ''}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      `;
    }

    function renderLabs(container) {
      container.innerHTML = `
        <div style="margin-bottom:2rem;">
          <h1 style="font-size:2rem; font-weight:800; color:#fff; margin-bottom:0.35rem;">Practice Labs</h1>
          <p style="color:var(--text-muted);">6 audited local coding environments with test suites and practice portals.</p>
        </div>
        <div class="items-grid">
          ${DATA.repos.map((r, idx) => {
            const escapedCmd = (r.cmd || '').replace(/\\/g, '\\\\');
            return `
              <div class="grid-card" id="repo-${idx}">
                <div>
                  <div style="font-size:0.75rem; color:var(--cyan); font-weight:600; margin-bottom:0.4rem;">${r.subject}</div>
                  <h3>${r.name}</h3>
                  <p>${r.desc}</p>
                </div>
                <div class="grid-card-footer">
                  <button class="btn-secondary" onclick="copyText('${escapedCmd}')">📋 Copy Command</button>
                  <a href="${r.url}" target="_blank" class="btn-primary">Open Portal ↗</a>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderGuides(container) {
      container.innerHTML = `
        <div style="margin-bottom:2rem;">
          <h1 style="font-size:2rem; font-weight:800; color:#fff; margin-bottom:0.35rem;">Study Guides</h1>
          <p style="color:var(--text-muted);">22 visual study guides and technical reference portals.</p>
        </div>
        <div class="items-grid">
          ${DATA.guides.map((g, idx) => `
            <div class="grid-card" id="guide-${idx}">
              <div>
                <div style="font-size:0.75rem; color:var(--cyan); font-weight:600; margin-bottom:0.4rem;">${g.subject}</div>
                <h3>${g.title}</h3>
                <p>${g.desc}</p>
              </div>
              <div class="grid-card-footer">
                <span></span>
                <a href="${g.url}" target="_blank" class="btn-primary">Read Guide ↗</a>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderSearch(container) {
      const q = searchQuery;
      let matchedSteps = [];
      let matchedBooks = [];
      let matchedLabs = [];
      let matchedGuides = [];

      DATA.subjects.forEach(s => {
        s.phases.forEach(ph => {
          ph.steps.forEach(st => {
            if (st.title.toLowerCase().includes(q) || st.desc.toLowerCase().includes(q)) {
              matchedSteps.push({ ...st, subject: s.name });
            }
          });
        });
      });

      DATA.books.forEach(b => {
        if (b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)) {
          matchedBooks.push(b);
        } else {
          const chMatch = b.chapters.filter(ch => ch.title.toLowerCase().includes(q));
          if (chMatch.length > 0) {
            matchedBooks.push({ ...b, chapters: chMatch });
          }
        }
      });

      DATA.repos.forEach(r => {
        if (r.name.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q) || r.subject.toLowerCase().includes(q)) {
          matchedLabs.push(r);
        }
      });

      DATA.guides.forEach(g => {
        if (g.title.toLowerCase().includes(q) || g.desc.toLowerCase().includes(q) || g.subject.toLowerCase().includes(q)) {
          matchedGuides.push(g);
        }
      });

      const total = matchedSteps.length + matchedBooks.length + matchedLabs.length + matchedGuides.length;

      container.innerHTML = `
        <div style="margin-bottom:2rem;">
          <h2 style="font-size:1.6rem; font-weight:700; color:#fff; margin-bottom:0.35rem;">
            Search Results for "${searchQuery}"
          </h2>
          <p style="color:var(--text-muted);">${total} matching items found.</p>
        </div>

        ${matchedSteps.length > 0 ? `
          <div style="font-size:0.85rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--cyan); margin:1.5rem 0 0.75rem;">
            Learning Steps (${matchedSteps.length})
          </div>
          ${matchedSteps.map(st => `
            <div class="step-card" style="margin-bottom:0.75rem;">
              <div class="step-header">
                <div>
                  <span style="font-size:0.75rem; color:var(--text-dim); font-weight:600;">${st.subject} &bull;</span>
                  <strong style="color:#fff; font-size:1rem; margin-left:0.25rem;">${st.title}</strong>
                </div>
              </div>
              <p class="step-desc" style="margin-bottom:0.75rem;">${st.desc}</p>
              <div style="display:flex; gap:0.5rem;">
                ${st.reading_url ? `<a href="${st.reading_url}" target="_blank" class="btn-link">Read Guide ↗</a>` : ''}
                ${st.practice_url ? `<a href="${st.practice_url}" target="_blank" class="btn-link">Practice ↗</a>` : ''}
              </div>
            </div>
          `).join('')}
        ` : ''}

        ${matchedBooks.length > 0 ? `
          <div style="font-size:0.85rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--cyan); margin:2rem 0 0.75rem;">
            Textbooks (${matchedBooks.length})
          </div>
          <div class="items-grid">
            ${matchedBooks.map(b => `
              <div class="grid-card">
                <div>
                  <h3>${b.title}</h3>
                  <p>${b.author} &bull; ${b.chapters.length} chapters</p>
                </div>
                <div class="grid-card-footer">
                  <span></span>
                  <a href="${b.url}" target="_blank" class="btn-primary">Read Book ↗</a>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${matchedLabs.length > 0 ? `
          <div style="font-size:0.85rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--cyan); margin:2rem 0 0.75rem;">
            Practice Labs (${matchedLabs.length})
          </div>
          <div class="items-grid">
            ${matchedLabs.map(r => `
              <div class="grid-card">
                <div>
                  <div style="font-size:0.75rem; color:var(--cyan); font-weight:600; margin-bottom:0.4rem;">${r.subject}</div>
                  <h3>${r.name}</h3>
                  <p>${r.desc}</p>
                </div>
                <div class="grid-card-footer">
                  <span></span>
                  <a href="${r.url}" target="_blank" class="btn-primary">Open Portal ↗</a>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${matchedGuides.length > 0 ? `
          <div style="font-size:0.85rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--cyan); margin:2rem 0 0.75rem;">
            Study Guides (${matchedGuides.length})
          </div>
          <div class="items-grid">
            ${matchedGuides.map(g => `
              <div class="grid-card">
                <div>
                  <div style="font-size:0.75rem; color:var(--cyan); font-weight:600; margin-bottom:0.4rem;">${g.subject}</div>
                  <h3>${g.title}</h3>
                  <p>${g.desc}</p>
                </div>
                <div class="grid-card-footer">
                  <span></span>
                  <a href="${g.url}" target="_blank" class="btn-primary">Read Guide ↗</a>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${total === 0 ? `
          <div style="padding:3rem 0; text-align:center; color:var(--text-muted);">
            No results found for "${searchQuery}".
          </div>
        ` : ''}
      `;
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
